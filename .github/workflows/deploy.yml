name: Build and push Docker images

on:
  push:
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: game
            image: game
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - service: frontend
            image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare GHCR image name
        id: ghcr
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}/${{ matrix.image }}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
            ${{ steps.ghcr.outputs.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker

    if: github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

    - name: Prepare project directory
      run: |
        ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
          set -e
          mkdir -p /opt/game
        EOF

    - name: Upload Docker Compose file
      run: |
        scp -i ~/.ssh/deploy_key \
          docker-compose.yml \
          "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/game/docker-compose.yml"

    - name: Deploy Docker Compose stack
      run: |
        ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
          set -e

          cd /opt/game

          test -f .env || (echo "ERROR: /opt/game/.env not found" && exit 1)

          docker compose pull
          docker compose up -d
          docker image prune -f

          docker compose ps
        EOF