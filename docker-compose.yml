services:
  postgres:
    image: postgres:16
    container_name: game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./backend/.env

  game:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game_backend
    command: ["./main"]
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: game_caddy
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist/frontend/browser:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config: