services:
  postgres:
    image: postgres:16
    container_name: game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  game:
    image: ${IMAGE_REPOSITORY}/game:latest
    container_name: game_backend
    command: ["./main"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${IMAGE_REPOSITORY}/frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - game

volumes:
  db_data: