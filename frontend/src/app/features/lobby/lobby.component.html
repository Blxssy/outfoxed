<div class="lobby-layout">
    <header class="lobby-header">
        <div class="lobby-logo">
            <img src="outfoxed_logo.png" alt="" class="lobby-logo__img" />
        </div>
    </header>

    <router-outlet />
</div>

@if (activeGameService.activeGame()) {
    <fox-button
        class="return-to-game-btn"
        (click)="returnToGame()"
        [text]="'Вернуться в игру'"
    />
}
