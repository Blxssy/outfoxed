<header class="auth-header">
    <div class="auth-logo">
        <img src="outfoxed_logo.png" alt="" class="auth-logo__img" />
    </div>
</header>

<div class="auth-main">
    <nav class="auth-switcher" aria-label="Навигация">
        <a
            routerLink="/auth/login"
            routerLinkActive="auth-switcher__btn--active"
            class="auth-switcher__btn"
            [routerLinkActiveOptions]="{ exact: true }"
        >
            Вход
        </a>
        <a
            routerLink="/auth/register"
            routerLinkActive="auth-switcher__btn--active"
            class="auth-switcher__btn"
        >
            Регистрация
        </a>
    </nav>

    <router-outlet />

    <div class="guest-section">
        <div class="guest-divider">
            <span class="guest-divider__line"></span>
            <span class="guest-divider__text">или</span>
            <span class="guest-divider__line"></span>
        </div>

        <fox-button
            class="guest-btn"
            [isDisabled]="isGuestLoading()"
            (click)="loginAsGuest()"
            [text]="'Войти как гость'"
            [color]="'green'"
        />

        @if (guestError()) {
            <div class="guest-error">{{ guestError() }}</div>
        }
    </div>
</div>
