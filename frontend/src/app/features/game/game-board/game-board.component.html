<div class="board-wrapper">
    <div class="board-frame">
        <div class="board-container">
            <div class="grid">
                @for (row of state.cells; track $index; let ri = $index) {
                    <ng-container>
                        @for (cell of row; track $index; let ci = $index) {
                            <div
                                class="cell"
                                [class.reachable]="isReachable(ri, ci)"
                                (click)="onCellClick(cell)"
                            >
                                @for (
                                    entry of getPlayersAt(ri, ci);
                                    track $index;
                                    let i = $index
                                ) {
                                    <ng-container>
                                        <div class="player-token">
                                            <div
                                                class="token-circle"
                                                [class.active]="
                                                    entry.player.id ===
                                                    state.currentPlayerId
                                                "
                                                [class]="
                                                    'token-circle' +
                                                    (entry.total > 1
                                                        ? ' offset-' + i
                                                        : '') +
                                                    (entry.player.id ===
                                                    state.currentPlayerId
                                                        ? ' active'
                                                        : '')
                                                "
                                                [style.background]="
                                                    entry.player.color
                                                "
                                                [attr.title]="entry.player.name"
                                            >
                                                {{ entry.player.name[0] }}
                                                @if (
                                                    entry.player.id ===
                                                    state.currentPlayerId
                                                ) {
                                                    <div
                                                        class="active-ring"
                                                    ></div>
                                                }
                                            </div>
                                        </div>
                                    </ng-container>
                                }
                            </div>
                        }
                    </ng-container>
                }
            </div>
        </div>
    </div>
</div>
