<div class="panel">
    <div class="panel-header">
        <span class="panel-title">Подозреваемые</span>
        <span class="panel-subtitle"
            >{{ revealedCount }} / {{ suspects().length }} открыто</span
        >
    </div>
    <div class="panel-hint">
        Сравнивайте вещи подозреваемых с найденными уликами. Исключайте
        невиновных!
    </div>
    <div class="panel-body">
        <div class="suspects-scroll">
            <div class="suspects-grid">
                @for (s of suspects(); track s.id) {
                    <div
                        class="suspect-card"
                        [class.revealed]="s.revealed"
                        [class.innocent]="s.excluded"
                        [title]="!s.revealed ? s.id : 'Неизвестно'"
                    >
                        @if (!s.revealed) {
                            <span class="suspect-q">?</span>
                            <span class="suspect-label">Неизвестно</span>
                        } @else if (s.revealed) {
                            <span class="suspect-label">{{ s.id }}</span>
                        } @else {
                            <span class="suspect-label muted">Невиновен</span>
                        }
                    </div>
                }
            </div>
        </div>
    </div>
</div>
