<div class="players-row">
    @for (player of players; track player.id) {
        <div
            class="player-card"
            [class.active]="player.id === currentPlayerId"
            [class.inactive]="player.id !== currentPlayerId"
            [class.player-0]="player.id === 0"
            [class.player-1]="player.id === 1"
            [class.player-2]="player.id === 2"
            [class.player-3]="player.id === 3"
        >
            @if (player.id === currentPlayerId) {
                <div class="turn-badge">ХОД</div>
            }
            <div class="player-name">{{ player.name }}</div>
        </div>
    }
</div>
