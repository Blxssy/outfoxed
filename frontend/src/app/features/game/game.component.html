<button (click)="leaveGame()"></button>
<div class="top-bar">
    <app-player-cards
        [players]="players()"
        [currentPlayerSeat]="activeSeat()"
    ></app-player-cards>
</div>

<div class="main-row">
    <div class="left-col">
        <app-fox-track
            [foxTrack]="fox()?.track ?? 0"
            [escapeAt]="fox()?.escapeAt ?? 15"
        ></app-fox-track>

        <app-game-board
            [cells]="boardCells()"
            [players]="players()"
            [activeSeat]="activeSeat()"
            [mySeat]="state()?.me?.seat"
            [reachableCells]="reachableCells()"
            [canMove]="canMovePawn()"
            (cellClicked)="onCellClicked($event)"
        />
        @if (canTakeClue()) {
            <button [disabled]="hasPending()" (click)="takeClue()">
                Взять улику
            </button>
        }
    </div>

    <div class="right-col">
        <app-dice-roll
            [roll]="roll()"
            [goalType]="goalType()"
            [isMyTurn]="isMyTurn()"
            [canChooseGoal]="canChooseGoal()"
            [canReroll]="canReroll()"
            [canFinishRoll]="canFinishRoll()"
            [disabled]="hasPending()"
            (goalChosen)="chooseGoal($event)"
            (rerolled)="rerollDice($event)"
            (rollFinished)="finishRoll()"
        ></app-dice-roll>

        <app-clues-list
            [clues]="revealedClues()"
            [totalCount]="totalCluesCount()"
        />

        <app-suspects [suspects]="suspects()"></app-suspects>

        <app-investigation-log></app-investigation-log>
    </div>
</div>
