<div class="panel">
    <div class="panel-header">
        <span class="panel-title">Журнал расследования</span>
    </div>

    <div class="panel-body">
        <div class="journal-scroll" #scrollContainer>
            @if (entries().length === 0) {
                <div class="journal-empty">Пока ничего не произошло...</div>
            }

            @for (entry of entries(); track entry.id) {
                <div class="journal-entry">
                    <div class="je-body">
                        <span class="je-time">
                            {{ entry.createdAt | date: "HH:mm:ss" }}
                        </span>

                        <div class="je-text">{{ entry.message }}</div>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
