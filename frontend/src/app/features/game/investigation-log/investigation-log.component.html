<div class="panel">
    <div class="panel-header">
        <span class="panel-title">Журнал расследования</span>
    </div>

    <div class="panel-body">
        <div class="journal-scroll" #scrollContainer>
            @if (entries.length === 0) {
                <div class="journal-empty">Пока ничего не произошло...</div>
            }

            @for (entry of reversed; track entry.id) {
                <div
                    class="journal-entry"
                    [class]="'journal-entry type-' + entry.type"
                >
                    <div class="je-body">
                        <div class="je-text" [innerHTML]="entry.html"></div>
                        <div class="je-time">
                            {{ entry.timestamp | date: "HH:mm:ss" }}
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
